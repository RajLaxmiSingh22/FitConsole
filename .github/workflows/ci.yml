name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitconsole
          POSTGRES_PASSWORD: fitconsole
          POSTGRES_DB: fitconsole_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitconsole"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: Backend
    env:
      # Disposable database for the tests that need PostgreSQL (test/helpers/database.js).
      TEST_DATABASE_URL: postgres://fitconsole:fitconsole@localhost:5432/fitconsole_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
